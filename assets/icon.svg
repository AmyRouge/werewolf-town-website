  <path fill="#ffffff" opacity="0.12" d="M512 282 L440 292 L338 150 L300 360 L512 330 Z"/>
  <path fill="#1b1442" opacity="0.14" d="M512 282 L584 292 L686 150 L724 360 L512 330 Z"/>
  <path fill="#ffffff" opacity="0.10" d="M244 474 L300 360 L380 470 L316 492 Z"/>
  <path fill="#1b1442" opacity="0.12" d="M780 474 L724 360 L644 470 L708 492 Z"/>
  <!-- inner ears -->
  <path fill="#ffb59a" d="M350 200 L420 296 L322 340 Z"/>
  <path fill="#f59a86" d="M674 200 L604 296 L702 340 Z"/>
  <!-- light mask -->
  <path fill="#f5f2ff" d="M512 344 L560 452 L640 520 L606 600 L512 676 L418 600 L384 520 L464 452 Z"/>
  <path fill="#dcd6f5" d="M512 676 L606 600 L640 520 L560 560 L512 600 Z"/>
  <!-- chest ruff -->
  <path fill="#ece8fb" d="M406 590 L512 676 L618 590 L668 712 L622 700 L610 772 L564 748 L512 820 L460 748 L414 772 L402 700 L356 712 Z"/>

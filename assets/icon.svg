  <path fill="#0a0d16" d="M412 744 L420 690 L424 640 L414 618 L426 602 L410 580 L424 562 L408 540 L422 522 L408 500 L402 470 L384 436 L322 350 L358 362 L322 296 L384 302 L416 294 L428 244 L452 290 L470 236 L480 296 C504 322 522 360 528 398 L548 424 L538 432 L560 462 C600 508 640 548 652 612 C660 652 670 690 704 708 C736 722 772 716 806 694 C806 726 776 748 728 750 L600 752 Z"/>

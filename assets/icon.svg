<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a63"/>
      <stop offset="0.45" stop-color="#5b3a96"/>
      <stop offset="0.78" stop-color="#c2558f"/>
      <stop offset="1" stop-color="#ff9a62"/>
    </linearGradient>
    <radialGradient id="moon" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="0.6" stop-color="#ffe7a8"/>
      <stop offset="1" stop-color="#ffc95c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#ffe2a0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe2a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8fd6"/>
      <stop offset="1" stop-color="#4e5aa6"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5664b4"/>
      <stop offset="1" stop-color="#3a4390"/>
    </linearGradient>
    <linearGradient id="town" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1d55"/>
      <stop offset="1" stop-color="#1c1238"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="132" cy="150" r="7" opacity="0.9"/><circle cx="236" cy="96" r="4" opacity="0.7"/>
    <circle cx="890" cy="128" r="7" opacity="0.9"/><circle cx="800" cy="70" r="4" opacity="0.7"/>
    <circle cx="96" cy="330" r="4" opacity="0.6"/><circle cx="934" cy="300" r="4" opacity="0.6"/>
  </g>

  <!-- moon -->
  <circle cx="512" cy="430" r="390" fill="url(#glow)"/>
  <circle cx="512" cy="430" r="300" fill="url(#moon)"/>
  <g fill="#f3c46a" opacity="0.35">
    <circle cx="300" cy="380" r="30"/><circle cx="730" cy="330" r="22"/><circle cx="700" cy="560" r="34"/>
  </g>

  <!-- wolf: neck + head -->
  <path fill="url(#neck)" d="M356 540 C340 640 290 720 170 790 L170 1024 L854 1024 L854 790 C734 720 684 640 668 540 Z"/>
  <path fill="url(#fur)" d="M338 150 L440 292 L512 282 L584 292 L686 150 L724 360 L780 474 L708 492 L630 596 L512 676 L394 596 L316 492 L244 474 L300 360 Z"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#26335a"/>
      <stop offset="0.5" stop-color="#141b33"/>
      <stop offset="1" stop-color="#0b0e17"/>
    </radialGradient>
    <radialGradient id="moon" cx="40%" cy="36%" r="70%">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.55" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f5a524"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.5" stop-color="#ffc75f" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffc75f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121729"/>
      <stop offset="1" stop-color="#07090f"/>

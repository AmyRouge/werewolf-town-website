  <path fill="#ffc531" d="M640 448 Q604 414 558 444 Q584 478 640 448 Z"/>
  <ellipse cx="432" cy="448" rx="9" ry="16" fill="#241a45"/>
  <ellipse cx="592" cy="448" rx="9" ry="16" fill="#241a45"/>
  <circle cx="437" cy="440" r="4" fill="#ffffff"/>
  <circle cx="597" cy="440" r="4" fill="#ffffff"/>
  <!-- nose + smile -->
  <path fill="#2a1f4d" d="M476 566 Q512 552 548 566 Q540 596 512 606 Q484 596 476 566 Z"/>
  <path fill="none" stroke="#2a1f4d" stroke-width="7" stroke-linecap="round" d="M512 606 L512 624 M484 630 Q498 642 512 624 Q526 642 540 630"/>

  <!-- town in front -->
  <path fill="url(#town)" d="M0 1024 L0 820 L36 820 L36 790 L140 700 L244 790 L244 860 L300 806 L356 860 L356 900 L380 900 L380 870 L452 806 L512 860 L572 806 L644 870 L644 900 L668 900 L668 860 L724 806 L780 860 L780 790 L884 700 L988 790 L988 820 L1024 820 L1024 1024 Z"/>
  <rect x="190" y="716" width="28" height="58" fill="#2e1d55"/>
  <rect x="806" y="716" width="28" height="58" fill="#2e1d55"/>
  <g fill="#ffcf5a">
    <rect x="84" y="838" width="40" height="48" rx="6"/>
    <rect x="158" y="838" width="40" height="48" rx="6"/>
    <rect x="286" y="880" width="30" height="38" rx="6"/>
    <rect x="490" y="900" width="44" height="54" rx="22"/>
    <rect x="708" y="880" width="30" height="38" rx="6"/>
    <rect x="826" y="838" width="40" height="48" rx="6"/>
    <rect x="900" y="838" width="40" height="48" rx="6"/>
    <rect x="120" y="930" width="40" height="48" rx="6"/>
    <rect x="864" y="930" width="40" height="48" rx="6"/>
  </g>
</svg>
